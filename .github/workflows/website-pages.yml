name: Website GitHub Pages

on:
  push:
    branches:
      - dev
    paths:
      - "website/**"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:

permissions: {} # lock everything by default (least-privilege)

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Add website deployment summary
        run: |
          echo "## Website GitHub Pages deployment result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Published \`${{ steps.deployment.outputs.page_url }}\`" >> $GITHUB_STEP_SUMMARY
