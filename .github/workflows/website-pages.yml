name: Website GitHub Pages

on:
  push:
    branches:
      - dev
    paths:
      - "website/**"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:

permissions: {} # lock everything by default (least-privilege)

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Publish static site to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          site_dir="$(mktemp -d)"
          cp -R website/. "$site_dir/"

          cd "$site_dir"
          git init -b gh-pages
          git add -A
          git commit -m "Deploy website from ${GITHUB_SHA}"

          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Add website deployment summary
        run: |
          echo "## Website GitHub Pages deployment result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Published branch \`gh-pages\` from commit \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "Custom domain: https://ver.ax/" >> $GITHUB_STEP_SUMMARY
