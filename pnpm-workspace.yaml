packages:
  - contracts
  - examples
  - explorer
  - sdk
  - subgraph
  - tutorial

allowBuilds:
  '@parcel/watcher': true
  '@reown/appkit': false
  bufferutil: true
  esbuild: true
  keccak: true
  netlify-cli: false
  node-libcurl: true
  secp256k1: true
  sharp: true
  unix-dgram: true
  unrs-resolver: true
  utf-8-validate: true

catalogs:
  core:
    prettier: 3.9.9
    typescript: 5.9.3
  eslint:
    '@eslint/js': 9.39.5
    eslint: 9.39.5
    eslint-plugin-import-x: 4.17.1
    globals: 16.5.0
    typescript-eslint: 8.70.1
  react:
    react: 19.3.0
    react-dom: 19.3.0
    '@tanstack/react-query': 5.104.0
    '@types/react': 19.3.0
    '@types/react-dom': 19.3.0
    eslint-plugin-react: 7.37.5
    eslint-plugin-react-hooks: 5.2.0
    eslint-plugin-react-refresh: 0.5.7
    vite-plugin-radar: 0.11.0
  solidity:
    '@openzeppelin/contracts': 4.9.6
    '@openzeppelin/contracts-upgradeable': 4.9.6
    solhint: 6.2.4
  types:
    '@types/node': 22.20.4
  web3:
    viem: 2.55.19

overrides:
  '@graphql-mesh/cli>node-libcurl': '-' # Optional dep; pulls git-hosted nan, rejected by blockExoticSubdeps
  '@graphql-mesh/cli>uWebSockets.js': '-' # Optional git-hosted dep, rejected by blockExoticSubdeps
