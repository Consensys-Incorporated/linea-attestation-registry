packages:
  - contracts
  - examples
  - explorer
  - sdk
  - subgraph
  - tutorial

allowBuilds:
  '@parcel/watcher': true
  '@reown/appkit': false
  bufferutil: true
  esbuild: true
  keccak: true
  netlify-cli: false
  node-libcurl: true
  secp256k1: true
  sharp: true
  unix-dgram: true
  unrs-resolver: true
  utf-8-validate: true

catalogs:
  core:
    prettier: 3.9.10
    typescript: 5.9.3
  eslint:
    '@eslint/js': 9.39.5
    eslint: 9.39.5
    eslint-plugin-import-x: 4.17.1
    globals: 16.5.0
    typescript-eslint: 8.72.0
  react:
    react: 19.3.1
    react-dom: 19.3.1
    '@tanstack/react-query': 5.104.5
    '@types/react': 19.3.0
    '@types/react-dom': 19.3.0
    eslint-plugin-react: 7.37.5
    eslint-plugin-react-hooks: 5.2.0
    eslint-plugin-react-refresh: 0.5.7
    vite-plugin-radar: 0.11.0
  solidity:
    '@openzeppelin/contracts': 4.9.6
    '@openzeppelin/contracts-upgradeable': 4.9.6
    solhint: 6.2.5
  types:
    '@types/node': 22.20.5
  web3:
    viem: 2.55.19

overrides:
  '@fastify/busboy@>=3.0.0 <3.2.2': '3.2.4'
  '@graphql-mesh/cli>node-libcurl': '-' # Optional dep; pulls git-hosted nan, rejected by blockExoticSubdeps
  '@graphql-mesh/cli>uWebSockets.js': '-' # Optional git-hosted dep, rejected by blockExoticSubdeps
  '@graphql-tools/executor-legacy-ws@<1.1.35': '1.1.39'
  '@graphql-tools/utils@>=12.0.0 <12.0.2': '12.1.0'
  '@nomicfoundation/hardhat-verify>undici': '6.29.1'
